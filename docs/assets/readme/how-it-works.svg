<path d="M451 204H474" fill="none" stroke="#7D828C" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#a)"/>
<path d="M726 204H749" fill="none" stroke="#7D828C" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#a)"/>
<path d="M1001 204H1024" fill="none" stroke="#7D828C" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#a)"/>
<path d="M875 116C875 70 600 70 600 116" fill="none" stroke="#E8642C" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#e)"/>
<text x="737" y="62" font-size="13" fill="#E8642C" text-anchor="middle">a failing check or a review finding goes back to work</text>
<rect x="205" y="378" width="790" height="118" rx="14" fill="#1B1C20" stroke="#2C2E34"/>
<circle cx="235" cy="410" r="13" fill="#E8642C"/><text x="235" y="415" font-size="13" font-weight="700" fill="#111214" text-anchor="middle">4</text>
<text x="259" y="416" font-size="17" font-weight="600" fill="#F4F5F7">Learn, after the session</text>
<circle cx="229" cy="457" r="2.5" fill="#E8642C"/><text x="243" y="462" font-size="14" fill="#B4B8C0">Proposes what to remember</text>
<circle cx="470" cy="457" r="2.5" fill="#E8642C"/><text x="484" y="462" font-size="14" fill="#B4B8C0">You accept or reject it</text>
<circle cx="700" cy="457" r="2.5" fill="#E8642C"/><text x="714" y="462" font-size="14" fill="#B4B8C0">Keeps fixes that made a check pass</text>
<path d="M1090 235V437H1003" fill="none" stroke="#7D828C" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#a)"/>
<path d="M325 372V295" fill="none" stroke="#7D828C" stroke-width="1.6" stroke-linecap="round" stroke-dasharray='5 6' marker-end="url(#a)"/>
<text x="339" y="338" font-size="13" fill="#B4B8C0" text-anchor="start">memory for the next task</text>
