<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="How a task runs in Local Kovach" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>How a task runs in Local Kovach</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7D828C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8642C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="539" rx="18" fill="#111214" stroke="#2C2E34"/>
<text x="50" y="46" font-size="12" font-weight="600" letter-spacing="1.4" fill="#7D828C" text-anchor="start">HOW A TASK RUNS</text>
<rect x="50" y="179" width="120" height="50" rx="25.0" fill="none" stroke="#7D828C"/><text x="110.0" y="209.0" font-size="14" font-weight="600" fill="#F4F5F7" text-anchor="middle">Your request</text>
<rect x="205" y="122" width="240" height="165" rx="14" fill="#1B1C20" stroke="#2C2E34"/>
<circle cx="235" cy="154" r="13" fill="#E8642C"/><text x="235" y="159" font-size="13" font-weight="700" fill="#111214" text-anchor="middle">1</text>
<text x="259" y="160" font-size="17" font-weight="600" fill="#F4F5F7">Understand</text>
<circle cx="229" cy="193" r="2.5" fill="#E8642C"/><text x="243" y="198" font-size="14" fill="#B4B8C0">Reads your project and rules</text>
<circle cx="229" cy="220" r="2.5" fill="#E8642C"/><text x="243" y="225" font-size="14" fill="#B4B8C0">Recalls memory and docs</text>
<circle cx="229" cy="247" r="2.5" fill="#E8642C"/><text x="243" y="252" font-size="14" fill="#B4B8C0">Writes a brief and a plan</text>
<rect x="480" y="122" width="240" height="165" rx="14" fill="#1B1C20" stroke="#2C2E34"/>
<circle cx="510" cy="154" r="13" fill="#E8642C"/><text x="510" y="159" font-size="13" font-weight="700" fill="#111214" text-anchor="middle">2</text>
<text x="534" y="160" font-size="17" font-weight="600" fill="#F4F5F7">Work</text>
<circle cx="504" cy="193" r="2.5" fill="#E8642C"/><text x="518" y="198" font-size="14" fill="#B4B8C0">Edits in small steps</text>
<circle cx="504" cy="220" r="2.5" fill="#E8642C"/><text x="518" y="225" font-size="14" fill="#B4B8C0">Uses tools in your project</text>
<circle cx="504" cy="247" r="2.5" fill="#E8642C"/><text x="518" y="252" font-size="14" fill="#B4B8C0">Commands ask you first</text>
<rect x="755" y="122" width="240" height="165" rx="14" fill="#1B1C20" stroke="#2C2E34"/>
<circle cx="785" cy="154" r="13" fill="#E8642C"/><text x="785" y="159" font-size="13" font-weight="700" fill="#111214" text-anchor="middle">3</text>
<text x="809" y="160" font-size="17" font-weight="600" fill="#F4F5F7">Verify</text>
<circle cx="779" cy="193" r="2.5" fill="#E8642C"/><text x="793" y="198" font-size="14" fill="#B4B8C0">Typecheck, lint, tests</text>
<circle cx="779" cy="220" r="2.5" fill="#E8642C"/><text x="793" y="225" font-size="14" fill="#B4B8C0">Looks at the built page</text>
<circle cx="779" cy="247" r="2.5" fill="#E8642C"/><text x="793" y="252" font-size="14" fill="#B4B8C0">Reviews its own diff</text>
<rect x="1030" y="179" width="120" height="50" rx="25.0" fill="none" stroke="#7D828C"/><text x="1090.0" y="209.0" font-size="14" font-weight="600" fill="#F4F5F7" text-anchor="middle">Answer</text>
