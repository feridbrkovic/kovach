# Local SearXNG for Local Kovach's web search. Listens on localhost only.
#   docker compose up -d
#   curl "http://127.0.0.1:8888/search?q=react+native&format=json"
services:
  searxng:
    image: docker.io/searxng/searxng:latest   # pin a tag before the first release
    container_name: kovach-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
